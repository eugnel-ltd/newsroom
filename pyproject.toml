[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openclaw-newsroom"
version = "0.1.0"
description = "Governed AI newsroom: editorial ledger, GraphRAG, Hermes Control Plane, and native reader surfaces."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.0",
    "lxml>=4.9",
    "PyYAML>=6.0",
    "neo4j==6.2.0",
    "opencc-python-reimplemented==0.1.7",
    "orjson>=3.10,<4",
    "pypdf==6.19.0",
]

[project.urls]
Repository = "https://github.com/fol2/newsroom"
Issues = "https://github.com/fol2/newsroom/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-xdist==3.8.0",
]
graphiti = [
    "graphiti-core==0.29.3",
    "httpx>=0.27",
    "cursor-sdk>=1.0.29",
]
cursor-research = [
    "cursor-sdk>=1.0.29",
]

[dependency-groups]
dev = [
  "pytest>=7.0",
  "pytest-cov>=4.0",
  "pytest-xdist==3.8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["newsroom", "scripts"]

[tool.pytest.ini_options]
testpaths = ["newsroom/tests"]
